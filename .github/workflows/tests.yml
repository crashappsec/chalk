name: tests

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/functional/**
      - config.nims
      - "*.nimble"
        # ignore server changes
      - "!tests/functional/server/**"
      # ignore docs not to waste CI minutes
      - "!src/docs/**"
      - Dockerfile
  pull_request:
    paths:
      - src/**
      - tests/functional/**
      - config.nims
      - "*.nimble"
        # ignore server changes
      - "!tests/functional/server/**"
      # ignore docs not to waste CI minutes
      - "!src/docs/**"
      - Dockerfile
  workflow_dispatch:
    inputs:
      suite:
        description: Manual suite
        type: choice
        default: full
        options:
          - full
          - fast

permissions:
  contents: read
  packages: write

env:
  TEST_DOCKER_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'fast' && '29.2.1' || '25' }}
  TEST_BUILDX_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'fast' && '0.38.1' || '0.14.0' }}
  SSH_KEY: ${{ secrets.SSH_KEY }}
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_TEST }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'fast' && '["ubuntu-24.04","ubuntu-24.04-arm"]' || '["ubuntu-22.04"]') }}
    name: pytest-${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}

    if: |
      (
        github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.body, format('skip:{0}', github.workflow))
      ) || (
        github.event_name == 'push'
      ) || (
        github.event_name == 'workflow_dispatch'
      ) || (
        github.event_name == 'schedule'
      )

    concurrency:
      # only allow one job per PR running
      # older pending jobs will be cancelled not to waste CI minutes
      # cannot use github.job here https://github.com/community/community/discussions/13496
      group: ${{ github.workflow }}-pytest-${{ github.ref }}-${{ matrix.runs-on }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # 4.1.6

      # for tests to checkout dummy private repo
      - name: Get GitHub Token
        id: org-token
        uses: crashappsec/action-github-app-token@main
        with:
          app_id: ${{ secrets.CHALK_GITHUB_APP_ID }}
          private_key: ${{ secrets.CHALK_GITHUB_APP_PRIVATE_KEY }}

      - name: Pin manual Docker engine
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'fast'
        run: sh tests/integration/install-docker-engine.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # 3.3.0
        with:
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # 3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # 3.2.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 #v2.0.1

      - name: Checkout sibling repos
        run: make nimble.paths

      - name: Bake Images
        env:
          MANUAL_FAST: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'fast' }}
        run: |
          if [ "$MANUAL_FAST" = true ]; then
            arch=$(docker version --format '{{.Server.Arch}}')
            docker buildx bake --allow=fs.read=../nimutils chalk server tests --load \
              --set 'tests.args.DOCKER_VERSION=29.2.1' \
              --set 'tests.args.BUILDX_VERSION=0.38.1' \
              --set "tests.cache-from=type=registry,ref=ghcr.io/crashappsec/chalk_tests:cache-linux-$arch" \
              --set "tests.cache-to=type=registry,ref=ghcr.io/crashappsec/chalk_tests:cache-linux-$arch"
            client_version=$(docker compose run --rm --no-deps --entrypoint docker tests --version)
            printf '%s\n' "$client_version"
            printf '%s\n' "$client_version" | grep -F 'Docker version 29.2.1,'
            buildx_version=$(docker compose run --rm --no-deps --entrypoint docker tests buildx version)
            printf '%s\n' "$buildx_version"
            printf '%s\n' "$buildx_version" | grep -F 'github.com/docker/buildx v0.38.1 '
          else
            docker buildx bake --allow=fs.read=../nimutils chalk server tests --load
          fi

      - name: Test pingttl
        run: |
          make src/utils/pingttl

      - name: Compile Chalk
        run: |
          make

      - name: Run tests (Fast)
        # run fast tests by default on PRs when
        # "tests:--slow" is missing in PR description
        if: |
          (
            github.event_name == 'pull_request' &&
            !contains(github.event.pull_request.body, 'tests:--slow')
          ) || (
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.suite == 'fast'
          )
        env:
          GITHUB_TOKEN: ${{ steps.org-token.outputs.token }}
          REGISTRY_PROXY_USERNAME: ${{ github.repository_owner }}
          REGISTRY_PROXY_PASSWORD: ${{ secrets.DOCKER_HUB_PUBLIC_READONLY_TOKEN }}
        run: |
          make tests_parallel args=""

      - name: Run tests (Slow)
        # run slow tests on non-PR builds and when
        # PR description has "tests:--slow"
        if: |
          (
            github.event_name != 'pull_request' ||
            contains(github.event.pull_request.body, 'tests:--slow')
          ) && !(
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.suite == 'fast'
          )
        env:
          GITHUB_TOKEN: ${{ steps.org-token.outputs.token }}
          REGISTRY_PROXY_USERNAME: ${{ github.repository_owner }}
          REGISTRY_PROXY_PASSWORD: ${{ secrets.DOCKER_HUB_PUBLIC_READONLY_TOKEN }}
        run: |
          make tests_parallel args="--slow"

      - name: Show service logs
        if: failure()
        run: |
          docker compose logs | grep -v health
