name: tests

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/functional/**
      - config.nims
      - "*.nimble"
        # ignore server changes
      - "!tests/functional/server/**"
      # ignore docs not to waste CI minutes
      - "!src/docs/**"
      - Dockerfile
  pull_request:
    paths:
      - src/**
      - tests/functional/**
      - config.nims
      - "*.nimble"
        # ignore server changes
      - "!tests/functional/server/**"
      # ignore docs not to waste CI minutes
      - "!src/docs/**"
      - Dockerfile
  workflow_dispatch:
    inputs:
      syft_identity_run:
        description: Syft fork Actions run ID that produced the Linux AMD64 binary.
        type: string
      syft_identity_sha256:
        description: Expected SHA-256 of the Linux AMD64 Syft executable.
        type: string

permissions:
  contents: read
  packages: write

env:
  SSH_KEY: ${{ secrets.SSH_KEY }}
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_TEST }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  pytest:
    runs-on: ubuntu-22.04

    if: |
      (
        github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.body, format('skip:{0}', github.workflow))
      ) || (
        github.event_name == 'push'
      ) || (
        github.event_name == 'workflow_dispatch' && inputs.syft_identity_run == '' && inputs.syft_identity_sha256 == ''
      ) || (
        github.event_name == 'schedule'
      )

    concurrency:
      # only allow one job per PR running
      # older pending jobs will be cancelled not to waste CI minutes
      # cannot use github.job here https://github.com/community/community/discussions/13496
      group: ${{ github.workflow }}-pytest-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # 4.1.6

      # for tests to checkout dummy private repo
      - name: Get GitHub Token
        id: org-token
        uses: crashappsec/action-github-app-token@main
        with:
          app_id: ${{ secrets.CHALK_GITHUB_APP_ID }}
          private_key: ${{ secrets.CHALK_GITHUB_APP_PRIVATE_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # 3.3.0
        with:
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # 3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # 3.2.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 #v2.0.1

      - name: Checkout sibling repos
        run: make nimble.paths

      - name: Bake Images
        run: |
          docker buildx bake --allow=fs.read=../nimutils chalk server tests --load

      - name: Test pingttl
        if: inputs.chalk_url == ''
        run: |
          make src/utils/pingttl

      - name: Compile Chalk
        if: inputs.chalk_url == ''
        run: |
          make

      - name: Download Chalk
        if: inputs.chalk_url != ''
        run: |
          curl -L "${{ inputs.chalk_url }}" > chalk
          chmod +x chalk
          ./chalk version

      - name: Run tests (Fast)
        # run fast tests by default on PRs when
        # "tests:--slow" is missing in PR description
        if: |
          github.event_name == 'pull_request' && (
            !contains(github.event.pull_request.body, 'tests:--slow')
          )
        env:
          GITHUB_TOKEN: ${{ steps.org-token.outputs.token }}
          REGISTRY_PROXY_USERNAME: ${{ github.repository_owner }}
          REGISTRY_PROXY_PASSWORD: ${{ secrets.DOCKER_HUB_PUBLIC_READONLY_TOKEN }}
        run: |
          make tests_parallel args=""

      - name: Run tests (Slow)
        # run slow tests on non-PR builds and when
        # PR description has "tests:--slow"
        if: |
          github.event_name != 'pull_request' || (
            contains(github.event.pull_request.body, 'tests:--slow')
          )
        env:
          GITHUB_TOKEN: ${{ steps.org-token.outputs.token }}
          REGISTRY_PROXY_USERNAME: ${{ github.repository_owner }}
          REGISTRY_PROXY_PASSWORD: ${{ secrets.DOCKER_HUB_PUBLIC_READONLY_TOKEN }}
        run: |
          make tests_parallel args="--slow"

      - name: Show service logs
        if: failure()
        run: |
          docker compose logs | grep -v health

  syft-identity:
    if: github.event_name == 'workflow_dispatch' && (inputs.syft_identity_run != '' || inputs.syft_identity_sha256 != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SYFT_RUN_ID: ${{ inputs.syft_identity_run }}
      SYFT_SHA256: ${{ inputs.syft_identity_sha256 }}
    steps:
      - name: Validate trial inputs
        run: |
          [[ "$SYFT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SYFT_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          persist-credentials: false
      - name: Get the GitHub App token for the Syft fork artifact
        id: org-token
        uses: crashappsec/action-github-app-token@main
        with:
          app_id: ${{ secrets.CHALK_GITHUB_APP_ID }}
          private_key: ${{ secrets.CHALK_GITHUB_APP_PRIVATE_KEY }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ steps.org-token.outputs.token }}
          repository: crashappsec/syft
          run-id: ${{ inputs.syft_identity_run }}
          name: syft-linux-amd64
          path: ${{ runner.temp }}/syft-identity
      - name: Verify trial binaries
        run: |
          cd "$RUNNER_TEMP/syft-identity"
          printf '%s  syft\n' "$SYFT_SHA256" | sha256sum -c -
          curl --fail --silent --show-error --location --output chalk \
            https://dl.crashoverride.run/chalk-commit-builds/chalk-a80005763f769313d47147292d4b3216ae111b96-Linux-x86_64
          echo '828b8d8aae008911a8ff63be6c4d49e27ab56b5bea54463718650cc07c84db3a  chalk' | sha256sum -c -
          chmod 555 chalk
      - name: Build with Chalk and verify the stored SBOM
        run: |
          python3 tests/syft-identity/trial.py \
            "$RUNNER_TEMP/syft-identity/chalk" "$RUNNER_TEMP/syft-identity/syft" \
            "$SYFT_SHA256" "$RUNNER_TEMP/syft-identity-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syft-identity-evidence
          path: ${{ runner.temp }}/syft-identity-evidence
          if-no-files-found: ignore
