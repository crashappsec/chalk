name: unit-tests

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/unit/**
      - tests/integration/**
      - .github/workflows/unit-tests.yml
      - config.nims
      - "*.nimble"
      # ignore docs not to waste CI minutes
      - "!src/docs/**"
      - Dockerfile
  pull_request:
    paths:
      - src/**
      - tests/unit/**
      - tests/integration/**
      - .github/workflows/unit-tests.yml
      - config.nims
      - "*.nimble"
      # ignore docs not to waste CI minutes
      - "!src/docs/**"
      - Dockerfile
  workflow_dispatch:
    inputs:
      suite:
        description: Unit test suite
        type: choice
        default: all
        options:
          - all
          - podman-sbom-http
          - bounded-http

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    if: |
      (
        github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.body, format('skip:{0}', github.workflow))
      ) || (
        github.event_name == 'push'
      ) || (
        github.event_name == 'workflow_dispatch'
      ) || (
        github.event_name == 'schedule'
      )

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-22.04
            arch: x86_64

    name: "${{ matrix.os }}-${{ matrix.arch }}"
    runs-on: ${{ matrix.runs-on }}

    concurrency:
      # only allow one job per PR running
      # older pending jobs will be cancelled not to waste CI minutes
      # cannot use github.job here https://github.com/community/community/discussions/13496
      group: ${{ github.workflow }}-unit-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # 4.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # 3.3.0
        with:
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # 3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # 3.2.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_PUBLIC_READONLY_TOKEN }}

      - name: Checkout sibling repos
        run: make nimble.paths

      - name: Bake images
        run: |
          docker buildx bake --allow=fs.read=../nimutils chalk --load

      - name: Run unit tests
        env:
          UNIT_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          case "$UNIT_SUITE" in
            all) make unit-tests ;;
            podman-sbom-http) make unit-tests args="--verbose pattern tests/unit/test_podman_sbom_http.nim" ;;
            bounded-http) make unit-tests args="--verbose pattern tests/unit/test_bounded_http.nim" ;;
            *) exit 2 ;;
          esac

      - name: Run process and platform contract checks
        if: ${{ (inputs.suite || 'all') == 'all' }}
        run: |
          python3 tests/unit/test_podman_run.py
          python3 tests/integration/test_podman_platform_proof.py

      - name: Build wrapper contract executables
        if: ${{ (inputs.suite || 'all') == 'all' }}
        run: |
          mkdir -p .developer-diagnostics
          docker compose run --rm --no-deps chalk nimble build -y
          docker compose run --rm --no-deps chalk nim c -d:debug --out:.developer-diagnostics/docker-build-status tests/integration/docker_build_status.nim

      - name: Verify Docker fallback and Podman pre-launch controls
        if: ${{ (inputs.suite || 'all') == 'all' }}
        run: |
          python3 tests/integration/test_docker_fallback.py .developer-diagnostics/docker-build-status --chalk "$PWD/chalk"
          python3 tests/integration/test_podman_controls.py "$PWD/chalk"
          python3 tests/integration/test_podman_heredoc.py "$PWD/chalk"
          python3 tests/integration/test_podman_security.py "$PWD/chalk"
